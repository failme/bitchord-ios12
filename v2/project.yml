name: BitChordIOS12V2

options:
  bundleIdPrefix: com.bitchord
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BitChordIOS12V2:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: BitChordIOS12/Sources
      - path: BitChordIOS12/Resources
    settings:
      base:
        INFOPLIST_FILE: BitChordIOS12/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The alternate icon is a second .appiconset; without this Xcode only
        # compiles the primary set into Assets.car and setAlternateIconName
        # cancels because the requested icon is not in the bundle.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bitchord.ios12v2
        PRODUCT_NAME: BitChordIOS12V2
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ONLY_ACTIVE_ARCH: NO

schemes:
  BitChordIOS12V2:
    build:
      targets:
        BitChordIOS12V2: all
    run:
      config: Release
    archive:
      config: Release

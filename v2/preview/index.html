<!doctype html>
<meta charset="utf-8">
<title>BitChord iOS 12 — v2 preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0a0a0b; color:#fff;
         font: 14px -apple-system, "SF Pro Text", system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:18px; padding:28px 16px 40px; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.2px; color:#8e8e93; margin:0; }
  .phone { width:390px; height:844px; border-radius:54px; background:#000;
           border:12px solid #1c1c1e; box-shadow:0 30px 80px rgba(0,0,0,.7);
           overflow:hidden; position:relative; }
  .phone img { width:100%; height:100%; object-fit:cover; display:block; }
  .island { position:absolute; top:12px; left:50%; transform:translateX(-50%);
            width:112px; height:30px; border-radius:16px; background:#000; }
  .tabs { display:flex; gap:6px; background:#1c1c1e; padding:5px; border-radius:13px; flex-wrap:wrap; justify-content:center; }
  .tabs button { appearance:none; border:0; background:transparent; color:#c7c7cc;
                 font:600 13px -apple-system, system-ui, sans-serif; padding:8px 14px; border-radius:9px; cursor:pointer; }
  .tabs button.on { background:#3a3a3c; color:#fff; }
  .note { color:#8e8e93; font-size:12px; max-width:390px; text-align:center; line-height:1.5; }
</style>
<h1>BitChord for iOS 12 · v2 — latest simulator captures</h1>
<div class="phone"><img id="shot" src="shots/home.png?v=1" alt=""><div class="island"></div></div>
<div class="tabs" id="tabs"></div>
<p class="note">Static captures from the CI simulator (real UIKit build, live catalogue and lyrics).
Playback and drag gestures need a device — these are pictures, not a running app.</p>
<script>
  const shots = [["Home","home"],["Explore","explore"],["Library","library"],["Search","search"],
                 ["Player · lyrics","lyrics"],["Settings","settings"]];
  const img = document.getElementById('shot'), tabs = document.getElementById('tabs');
  shots.forEach(([label,name], i) => {
    const b = document.createElement('button');
    b.textContent = label; if (i === 0) b.className = 'on';
    b.onclick = () => { img.src = 'shots/' + name + '.png?v=' + Date.now();
      [...tabs.children].forEach(c => c.className = ''); b.className = 'on'; };
    tabs.appendChild(b);
  });
</script>

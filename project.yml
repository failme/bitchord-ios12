name: BitChordIOS12

options:
  bundleIdPrefix: com.bitchord
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BitChordIOS12:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: BitChordIOS12/Sources
      - path: BitChordIOS12/Resources
    settings:
      base:
        INFOPLIST_FILE: BitChordIOS12/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.bitchord.ios12
        PRODUCT_NAME: BitChordIOS12
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.17"
        CURRENT_PROJECT_VERSION: "18"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ONLY_ACTIVE_ARCH: NO

schemes:
  BitChordIOS12:
    build:
      targets:
        BitChordIOS12: all
    run:
      config: Release
    archive:
      config: Release

name: Build iOS 12 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project BitChordIOS12.xcodeproj -list

      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChordIOS12.xcodeproj \
            -scheme BitChordIOS12 \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "::error ::build.log was never created - the build failed before xcodebuild ran"
            exit 0
          fi
          grep -aE "error:|xcodebuild: error|BUILD FAILED|The following build commands failed" build.log \
            | head -8 \
            | while IFS= read -r line; do
                line="${line%$'\r'}"
                line="${line//%/%25}"
                echo "::error ::${line:0:800}"
              done
          if ! grep -qaE "error:" build.log; then
            tail -8 build.log | while IFS= read -r line; do
              line="${line%$'\r'}"
              line="${line//%/%25}"
              echo "::notice ::${line:0:800}"
            done
          fi

      - name: Report build diagnostics
        if: always()
        run: |
          {
            echo "### Schemes in generated project"
            echo '```'
            xcodebuild -project BitChordIOS12.xcodeproj -list 2>&1 || true
            echo '```'
            echo "### Compiler errors"
            echo '```'
            grep -nE "error:|xcodebuild: error|BUILD FAILED" build.log 2>/dev/null | head -60 || true
            echo '```'
            echo "### Last 40 log lines"
            echo '```'
            tail -40 build.log 2>/dev/null || echo "(no build.log written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment target
        if: success()
        run: |
          set -o pipefail
          APP="build/Build/Products/Release-iphoneos/BitChordIOS12.app"
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "MinimumOSVersion: $MIN"
          echo "::notice ::Built app MinimumOSVersion = $MIN"
          MINOS=$(otool -l "$APP/BitChordIOS12" | grep -m1 minos | tr -s ' ' | sed 's/^ *//')
          echo "binary $MINOS"
          echo "::notice ::Binary LC_BUILD_VERSION $MINOS"
          ARCHS=$(lipo -archs "$APP/BitChordIOS12")
          echo "::notice ::Architectures: $ARCHS"

      - name: Package unsigned IPA
        if: success()
        run: |
          set -o pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BitChordIOS12.app" Payload/
          /usr/bin/zip -qry BitChordIOS12-unsigned.ipa Payload
          ls -lh BitChordIOS12-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChordIOS12-unsigned-ipa
          path: BitChordIOS12-unsigned.ipa
          retention-days: 30

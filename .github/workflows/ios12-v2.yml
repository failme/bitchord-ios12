name: Build iOS 12 IPA (v2 port)

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/ios12-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project BitChordIOS12V2.xcodeproj -list

      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChordIOS12V2.xcodeproj \
            -scheme BitChordIOS12V2 \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "::error ::build.log was never created - the build failed before xcodebuild ran"
            exit 0
          fi
          grep -aE "error:|xcodebuild: error|BUILD FAILED|The following build commands failed" build.log \
            | head -8 \
            | tr -d '\r' \
            | while IFS= read -r line; do
                echo "::error ::${line:0:800}"
              done
          if ! grep -qaE "error:" build.log; then
            tail -8 build.log \
              | tr -d '\r' \
              | while IFS= read -r line; do
                  echo "::notice ::${line:0:800}"
                done
          fi

      - name: Report build diagnostics
        if: always()
        run: |
          {
            echo "### Schemes in generated project"
            echo '```'
            xcodebuild -project BitChordIOS12V2.xcodeproj -list 2>&1 || true
            echo '```'
            echo "### Compiler errors"
            echo '```'
            grep -nE "error:|xcodebuild: error|BUILD FAILED" build.log 2>/dev/null | head -60 || true
            echo '```'
            echo "### Last 40 log lines"
            echo '```'
            tail -40 build.log 2>/dev/null || echo "(no build.log written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment target
        if: success()
        run: |
          set -o pipefail
          APP="build/Build/Products/Release-iphoneos/BitChordIOS12V2.app"
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "MinimumOSVersion: $MIN"
          echo "::notice ::Built app MinimumOSVersion = $MIN"
          MINOS=$(otool -l "$APP/BitChordIOS12V2" | grep -m1 minos | tr -s ' ' | sed 's/^ *//')
          echo "binary $MINOS"
          echo "::notice ::Binary LC_BUILD_VERSION $MINOS"
          ARCHS=$(lipo -archs "$APP/BitChordIOS12V2")
          echo "::notice ::Architectures: $ARCHS"

      - name: Package unsigned IPA
        if: success()
        run: |
          set -o pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BitChordIOS12V2.app" Payload/
          /usr/bin/zip -qry BitChordIOS12V2-unsigned.ipa Payload
          ls -lh BitChordIOS12V2-unsigned.ipa

      - name: Verify the IPA itself
        if: success()
        run: |
          set -o pipefail
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -q BitChordIOS12V2-unsigned.ipa -d /tmp/ipacheck
          APP=$(find /tmp/ipacheck/Payload -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "ipa MinimumOSVersion=$MIN"
          echo "::notice ::IPA MinimumOSVersion = $MIN"
          test "$MIN" = "12.0"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ARCHS=$(lipo -archs "$BIN")
          echo "ipa architectures=$ARCHS"
          echo "::notice ::IPA architectures = $ARCHS"
          echo "$ARCHS" | grep -q "arm64"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChordIOS12V2-unsigned-ipa
          path: v2/BitChordIOS12V2-unsigned.ipa
          retention-days: 30

  simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChordIOS12V2.xcodeproj \
            -scheme BitChordIOS12V2 \
            -sdk iphonesimulator \
            -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build-sim \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee sim.log

      - name: Report simulator build errors
        if: failure()
        run: |
          if [ -f sim.log ]; then
            grep -aE "error:|xcodebuild: error|BUILD FAILED" sim.log \
              | head -8 \
              | tr -d '\r' \
              | while IFS= read -r line; do
                  echo "::error ::${line:0:800}"
                done
          fi

      - name: Package simulator bundle for Appetize
        if: success()
        run: |
          set -o pipefail
          APP="build-sim/Build/Products/Release-iphonesimulator/BitChordIOS12V2.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" BitChordIOS12V2-simulator.zip
          ls -lh BitChordIOS12V2-simulator.zip
          echo "::notice ::Simulator bundle packaged for Appetize upload"

      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChordIOS12V2-simulator
          path: v2/BitChordIOS12V2-simulator.zip
          retention-days: 30
  screenshots:
    runs-on: macos-15
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChordIOS12V2.xcodeproj \
            -scheme BitChordIOS12V2 \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build-shots \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee shots-build.log

      - name: Capture screens
        run: |
          set -o pipefail
          APP="build-shots/Build/Products/Release-iphonesimulator/BitChordIOS12V2.app"
          test -d "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1 || true)
          echo "runtime=$RUNTIME"
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]' | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}' | head -1 || true)
          if [ -z "$UDID" ]; then
            for T in iPhone-17-Pro iPhone-16 iPhone-15; do
              UDID=$(xcrun simctl create BC-Screens "com.apple.CoreSimulator.SimDeviceType.$T" "$RUNTIME" 2>/dev/null || true)
              if [ -n "$UDID" ]; then break; fi
            done
          fi
          echo "udid=$UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          mkdir -p "$CONTAINER/Documents/shots"
          # A local addon, speaking the same two HTTP calls the app's AddonService
          # uses. It serves one generated lossless file for the one track the
          # harness nominates and 404s everything else, so the fallback is real.
          python3 - <<'PY'
          import random, struct, wave
          random.seed(7)
          sr = 44100; secs = 40
          with wave.open('/tmp/bc_lossless.wav', 'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr)
              frames = bytearray()
              for _ in range(sr * secs):
                  v = random.randint(-28000, 28000)
                  frames += struct.pack('<hh', v, v)
              w.writeframes(bytes(frames))
          PY
          afconvert -f m4af -d alac /tmp/bc_lossless.wav /tmp/bc_lossless.m4a
          python3 tools/addon_server.py --port 8765 --media /tmp/bc_lossless.m4a > /tmp/addon-server.log 2>&1 &
          ADDON_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/manifest > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8765/manifest || {
            echo "::error ::addon server did not start"
            cat /tmp/addon-server.log 2>/dev/null || true
            exit 1
          }
          # The WebDAV fixture the simulator connects to: a known tree, one
          # real AAC file, and Basic auth so the wrong-password path is real.
          mkdir -p /tmp/webdav/Music/Nested
          cp /tmp/bc_lossless.m4a /tmp/webdav/Music/track.m4a
          printf 'BitChord WebDAV fixture\n' > /tmp/webdav/readme.txt
          python3 tools/webdav_server.py --port 8791 --user demo --password secret \
            --root /tmp/webdav > /tmp/webdav-server.log 2>&1 &
          WEBDAV_PID=$!
          for i in $(seq 1 20); do
            curl -sf -u demo:secret -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8791/ > /dev/null && break
            sleep 0.5
          done
          curl -sf -u demo:secret -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8791/ \
            | grep -q 'Music' || {
              echo "::error ::WebDAV fixture did not start"
              cat /tmp/webdav-server.log 2>/dev/null || true
              exit 1
            }
          # First launch downloads one track and quits; the second launch below
          # reads that index back off disk, so the capture proves persistence
          # across a relaunch rather than same-process memory.
          xcrun simctl launch "$UDID" "$BUNDLE" -BCSeedDownload "$CONTAINER/Documents/shots"
          for i in $(seq 1 60); do
            [ -f "$CONTAINER/Documents/shots/download-report.txt" ] && break
            sleep 2
          done
          echo "### Seed report"
          cat "$CONTAINER/Documents/shots/download-report.txt" 2>/dev/null || echo "(seed wrote nothing)"
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 2
          SIMCTL_CHILD_BC_WEBDAV_URL=http://127.0.0.1:8791/ \
          SIMCTL_CHILD_BC_WEBDAV_USER=demo \
          SIMCTL_CHILD_BC_WEBDAV_PASS=secret \
          xcrun simctl launch "$UDID" "$BUNDLE" -BCScreenshots "$CONTAINER/Documents/shots"
          # The harness walks the tabs, plays a track, then runs the whole
          # download sequence (resume check, offline playback, delete, quality
          # probe, mid-transfer shot, menus, Wi-Fi hold). It writes done.txt
          # when finished, so wait for the work rather than guessing.
          for i in $(seq 1 480); do
            [ -f "$CONTAINER/Documents/shots/done.txt" ] && break
            sleep 2
          done
          if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE"; then
            echo "app is not running; collecting why"
          fi
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'processImagePath CONTAINS "BitChordIOS12V2"' 2>/dev/null \
            | grep -aiE "fatal|exception|assert|crash|error" | tail -30 || true
          find ~/Library/Logs/DiagnosticReports -name '*BitChord*' -mmin -10 \
            -exec sh -c 'echo "== $1"; head -60 "$1"' _ {} \; 2>/dev/null || true
          rm -rf shots && mkdir -p shots
          cp -R "$CONTAINER/Documents/shots/." shots/ || true
          ls -l shots
          ls shots/*.png > /dev/null

          # Deep links: track, album, artist, playlist, radio, home, then a
          # cold launch from a link. Each handler records the route it resolved
          # and the screen it put on top, so the report is readable outside.
          IDS="$CONTAINER/Documents/shots/deeplink-ids.txt"
          echo "### Deep link ids"
          cat "$IDS" 2>/dev/null || true
          id_of() { sed -n "s/^$1=//p" "$IDS" 2>/dev/null | head -1; }
          TRACK_ID=$(id_of track); ALBUM_ID=$(id_of album)
          ARTIST_ID=$(id_of artist); PLAYLIST_ID=$(id_of playlist)
          test -n "$TRACK_ID" || TRACK_ID="4NRXx6U8ABQ"
          test -n "$ALBUM_ID" || ALBUM_ID="MPREb_4pL8Y0A0Gm0"
          test -n "$ARTIST_ID" || ARTIST_ID="UCvVp1_4kM3Q0a4V4m0P0u2g"
          test -n "$PLAYLIST_ID" || PLAYLIST_ID="PLBCfixture"
          echo "deep links: track=$TRACK_ID album=$ALBUM_ID artist=$ARTIST_ID playlist=$PLAYLIST_ID"
          # Registration: SpringBoard offers to open BitChord for the scheme.
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 1
          xcrun simctl openurl "$UDID" "bitchord://track/$TRACK_ID" || true
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/deeplink-prompt.png > /dev/null 2>&1 || true
          # The confirmation cannot be tapped headlessly, so each destination is
          # proven by launching the app cold with the same URL, through the same
          # router (the launch-options path).
          launch_link() {
            xcrun simctl terminate "$UDID" "$BUNDLE" > /dev/null 2>&1 || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" -BCDeepLink "$1" > /dev/null 2>&1 || true
            sleep 5
          }
          launch_link "bitchord://track/$TRACK_ID"
          xcrun simctl io "$UDID" screenshot shots/deeplink-track.png > /dev/null 2>&1 || true
          launch_link "bitchord://album/$ALBUM_ID"
          xcrun simctl io "$UDID" screenshot shots/deeplink-cold.png > /dev/null 2>&1 || true
          launch_link "bitchord://artist/$ARTIST_ID"
          launch_link "bitchord://playlist/$PLAYLIST_ID"
          launch_link "bitchord://radio/$TRACK_ID"
          launch_link "bitchord://home"
          cp "$CONTAINER/Documents/shots/deeplinks.txt" shots/deeplinks.txt 2>/dev/null || true
          echo "### Deep link report"
          cat shots/deeplinks.txt 2>/dev/null || echo "(no deep link report)"

          # The first-run flow on a 320x568 window: every step photographed and
          # every primary action checked to land on the small screen.
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" -BCOnboardingOnly "$CONTAINER/Documents/shots" -BCSmallScreen
          for i in $(seq 1 30); do
            [ -f "$CONTAINER/Documents/shots/onboarding-small-report.txt" ] && break
            sleep 2
          done
          cp -R "$CONTAINER/Documents/shots/." shots/ || true
          echo "### Onboarding 320x568 report"
          cat shots/onboarding-small-report.txt 2>/dev/null || echo "(no small-screen report)"
          grep -q "onboarding.window=320x568" shots/onboarding-small-report.txt
          grep -q "onboarding.primaryVisible=true" shots/onboarding-small-report.txt
          grep -q "onboarding.primaryVisible2=true" shots/onboarding-small-report.txt
          grep -q "onboarding.primaryVisible3=true" shots/onboarding-small-report.txt
          grep -q "onboarding.primaryVisible4=true" shots/onboarding-small-report.txt
          grep -q "onboarding.completed=true" shots/onboarding-small-report.txt
          grep -q "onboarding.dismissed=true" shots/onboarding-small-report.txt

          REPORT=shots/download-report.txt
          echo "### Download report"
          cat "$REPORT" || { echo "::error ::no download report written"; exit 1; }
          echo "### Addon server log"
          tail -40 /tmp/addon-server.log 2>/dev/null || true

          # Relaunch, offline playback, deletion.
          grep -q "resume.saved=1" "$REPORT"
          grep -q "localPlayback=true" "$REPORT"
          grep -q "fileRemoved=true" "$REPORT"
          grep -q "deletedRows=0" "$REPORT"

          # Two settings, two renditions: the labels are the app's, the bitrates
          # are measured by afinfo from the files the app stored.
          grep -q "quality.high.label=JioSaavn 320kbps" "$REPORT"
          grep -q "quality.saver.label=JioSaavn 96kbps" "$REPORT"
          grep -q "quality.saverSmaller=true" "$REPORT"
          rate() {
            afinfo "$1" 2>/dev/null | awk '/bit rate/ {for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) {print $i; exit}}'
          }
          test -s shots/quality-high.m4a
          test -s shots/quality-saver.m4a
          HIGH_RATE=$(rate shots/quality-high.m4a)
          SAVER_RATE=$(rate shots/quality-saver.m4a)
          HIGH_SIZE=$(stat -f%z shots/quality-high.m4a)
          SAVER_SIZE=$(stat -f%z shots/quality-saver.m4a)
          echo "high: ${HIGH_RATE}bps ${HIGH_SIZE}B | saver: ${SAVER_RATE}bps ${SAVER_SIZE}B"
          test -n "$HIGH_RATE"
          test -n "$SAVER_RATE"
          test "$HIGH_RATE" -ge 280000
          test "$SAVER_RATE" -le 128000
          test "$SAVER_SIZE" -lt "$HIGH_SIZE"

          # A real mid-transfer frame, the Wi-Fi hold, and all three menus.
          PROGRESS=$(sed -n 's/^progress.captured=//p' "$REPORT" | head -1)
          echo "progress captured at ${PROGRESS}%"
          test -n "$PROGRESS"
          test "$PROGRESS" -gt 0
          test "$PROGRESS" -lt 100
          grep -q "wifi.blocked=true" "$REPORT"
          grep -q "wifi.failedRows=1" "$REPORT"
          grep -q "sheet.delete.downloaded=true" "$REPORT"
          grep -q "sheet.cancel.downloading=true" "$REPORT"
          grep -q "sheet.download.idle=true" "$REPORT"

          # Storage limit: the 10 MB cap refuses a track that would pass it, the
          # reason is on the row, the file already saved is untouched, and a cap
          # lowered under the usage keeps every byte on disk.
          grep -q "cap.blocked=true" "$REPORT"
          grep -q "cap.reason=Storage limit reached." "$REPORT"
          grep -q "cap.savedUnchanged=true" "$REPORT"
          grep -q "cap.lowLimitFiles=true" "$REPORT"
          grep -q "cap.lowLimitCount=1" "$REPORT"

          # Playlist sync: real playlist pulled from the catalogue, tracks in
          # order, and a visible failure that changes nothing.
          grep -q "sync.ok=true" "$REPORT"
          SYNC_TRACKS=$(sed -n 's/^sync.tracks=//p' "$REPORT" | head -1)
          echo "synced tracks: $SYNC_TRACKS"
          test -n "$SYNC_TRACKS"
          test "$SYNC_TRACKS" -ge 1
          test -n "$(sed -n 's/^sync.first=//p' "$REPORT" | head -1)"
          grep -q "sync.failure.ok=true" "$REPORT"
          grep -q "sync.failure.unchanged=true" "$REPORT"

          # Lossless addon: the addon's file must be a genuinely higher-bitrate,
          # larger file than the standard rendition, and a track the addon does
          # not serve must still download from the standard catalogue.
          grep -q "addon.label=Lossless" "$REPORT"
          grep -q "addon.fallback.ok=true" "$REPORT"
          grep -q "addon.fallback.label=JioSaavn 320kbps" "$REPORT"
          test -s shots/quality-lossless.m4a
          test -s shots/quality-fallback.m4a
          LOSS_RATE=$(rate shots/quality-lossless.m4a)
          STD_RATE=$(rate shots/quality-fallback.m4a)
          LOSS_SIZE=$(stat -f%z shots/quality-lossless.m4a)
          STD_SIZE=$(stat -f%z shots/quality-fallback.m4a)
          echo "lossless: ${LOSS_RATE}bps ${LOSS_SIZE}B | standard: ${STD_RATE}bps ${STD_SIZE}B"
          test -n "$LOSS_RATE"
          test -n "$STD_RATE"
          test "$LOSS_RATE" -gt 500000
          test "$STD_RATE" -lt 400000
          test "$LOSS_RATE" -gt "$STD_RATE"
          test "$LOSS_SIZE" -gt 1000000

          # Local music, queue history, radio, enhanced-LRC syllables, the
          # artist page and a mood tile: each driven through its own screen.
          grep -q "local.folders=1" "$REPORT"
          grep -q "local.tracks=1" "$REPORT"
          grep -q "local.playing=true" "$REPORT"
          grep -q "local.engine=native Local Music" "$REPORT"
          grep -q "badge.downloaded=true" "$REPORT"
          HISTORY=$(sed -n 's/^history.count=//p' "$REPORT" | head -1)
          echo "history entries: $HISTORY"
          test -n "$HISTORY"
          test "$HISTORY" -ge 2
          grep -q "history.enabled=true" "$REPORT"
          RADIO=$(sed -n 's/^radio.tracks=//p' "$REPORT" | head -1)
          echo "radio tracks: $RADIO"
          test -n "$RADIO"
          test "$RADIO" -ge 5
          grep -q "radio.playing=true" "$REPORT"
          grep -q "radio.failedShown=true" "$REPORT"
          grep -q "lyrics.syllables=3" "$REPORT"
          grep -q "lyrics.revealAdvance=true" "$REPORT"
          grep -q "lyrics.text=Hello world" "$REPORT"
          ARTIST=$(sed -n 's/^artist.loaded=//p' "$REPORT" | head -1)
          echo "artist tracks: $ARTIST"
          test -n "$ARTIST"
          test "$ARTIST" -ge 5
          MOODS=$(sed -n 's/^moods.tracks=//p' "$REPORT" | head -1)
          echo "mood tracks: $MOODS"
          test -n "$MOODS"
          test "$MOODS" -ge 5
          CACHE_FREED=$(sed -n 's/^cache.freed=//p' "$REPORT" | head -1)
          echo "cache freed: $CACHE_FREED bytes"
          test -n "$CACHE_FREED"
          test "$CACHE_FREED" -ge 1048576
          grep -q "cache.cleared=true" "$REPORT"
          grep -q "cache.limit=" "$REPORT"

          # Song menu, add-to-playlist, queue edits, the History screen, song
          # info and autoplay past the end of a queue.
          grep -q "menu.hasPlayNext=true" "$REPORT"
          grep -q "menu.hasAddToQueue=true" "$REPORT"
          grep -q "menu.hasPlaylist=true" "$REPORT"
          grep -q "menu.hasSongInfo=true" "$REPORT"
          grep -q "menu.hasShare=true" "$REPORT"
          grep -q "menu.hasArtist=true" "$REPORT"
          grep -q "menu.playlistGrew=true" "$REPORT"
          grep -q "queue.before=2" "$REPORT"
          grep -q "queue.afterAdd=3" "$REPORT"
          grep -q "queue.afterRemove=2" "$REPORT"
          grep -q "queue.playNext=true" "$REPORT"
          grep -q "queue.afterMove=3" "$REPORT"
          grep -q "queue.moved=true" "$REPORT"
          HISTORY_PAGE=$(sed -n 's/^historyPage.rows=//p' "$REPORT" | head -1)
          test -n "$HISTORY_PAGE"
          test "$HISTORY_PAGE" -ge 2
          grep -q "historyPage.afterClear=0" "$REPORT"
          HISTORY_RESTORED=$(sed -n 's/^historyPage.restored=//p' "$REPORT" | head -1)
          test -n "$HISTORY_RESTORED"
          # Clearing then playing one song repopulates it; the relaunch proof
          # separately requires two entries.
          test "$HISTORY_RESTORED" -ge 1
          REPLAY=$(sed -n 's/^replay.entries=//p' "$REPORT" | head -1)
          test -n "$REPLAY"
          test "$REPLAY" -ge 1
          REPLAY_PLAYS=$(sed -n 's/^replay.plays=//p' "$REPORT" | head -1)
          test -n "$REPLAY_PLAYS"
          test "$REPLAY_PLAYS" -ge 1
          test -n "$(sed -n 's/^replay.top=//p' "$REPORT" | head -1)"
          grep -q "info.rows=7" "$REPORT"
          test -n "$(sed -n 's/^info.title=//p' "$REPORT" | head -1)"
          test -n "$(sed -n 's/^info.source=//p' "$REPORT" | head -1)"
          grep -q "autoplay.setting=true" "$REPORT"
          grep -q "autoplay.started=true" "$REPORT"
          AUTOPLAY=$(sed -n 's/^autoplay.tracks=//p' "$REPORT" | head -1)
          test -n "$AUTOPLAY"
          test "$AUTOPLAY" -ge 5

          # Onboarding: shown on first launch, completed, and re-runnable from
          # the Settings row the user actually taps.
          grep -q "onboarding.shown=true" shots/onboarding-report.txt
          grep -q "onboarding.step1=Welcome to BitChord" shots/onboarding-report.txt
          grep -q "onboarding.step2=A quick tour" shots/onboarding-report.txt
          grep -q "onboarding.step3=Choose your library" shots/onboarding-report.txt
          grep -q "onboarding.completed=true" shots/onboarding-report.txt
          grep -q "onboarding.dismissed=true" shots/onboarding-report.txt
          grep -q "onboarding.rerun=true" "$REPORT"

          # Deep links resolved to distinct screens.
          grep -q "route=track id=$TRACK_ID screen=NowPlaying" shots/deeplinks.txt
          grep -q "route=album id=$ALBUM_ID screen=Album" shots/deeplinks.txt
          grep -q "route=artist id=$ARTIST_ID screen=Artist" shots/deeplinks.txt
          grep -q "route=playlist id=$PLAYLIST_ID screen=Playlist" shots/deeplinks.txt
          grep -q "route=radio id=$TRACK_ID screen=Radio" shots/deeplinks.txt
          grep -q "route=home screen=Home" shots/deeplinks.txt
          grep -q "cold=1" shots/deeplinks.txt
          test -s shots/deeplink-prompt.png
          test -s shots/deeplink-track.png
          test -s shots/deeplink-cold.png

          # WebDAV: the CI-hosted tree, a streamed file, and a visible auth error.
          grep -q "webdav.listed=true" "$REPORT"
          grep -q "webdav.hasMusic=true" "$REPORT"
          grep -q "webdav.folder=true" "$REPORT"
          grep -q "webdav.hasTrack=true" "$REPORT"
          grep -q "webdav.playing=true" "$REPORT"
          grep -q "webdav.title=track.m4a" "$REPORT"
          grep -q "webdav.isPlaying=true" "$REPORT"
          grep -q "webdav.authErrorShown=true" "$REPORT"
          grep -q "webdav.authError=Wrong username or password." "$REPORT"
          # The fixture saw a PROPFIND and a GET for the streamed file.
          grep -q "PROPFIND" /tmp/webdav-server.log
          grep -q "GET /Music/track.m4a" /tmp/webdav-server.log

          for shot in downloads download-progress downloads-saver settings-downloads \
                      sheet-delete sheet-cancel sheet-download wifi-blocked offline downloads-empty \
                      storage-cap settings-storage library-synced playlist-synced sync-failed \
                      downloads-addon local-music local-songs queue-history radio radio-failed \
                      lyrics-karaoke artist moods settings-cache song-actions add-to-playlist \
                      queue-edit history history-empty replay song-info autoplay \
                      onboarding-welcome onboarding-tour onboarding-library onboarding-ready \
                      onboarding-rerun onboarding-small-welcome onboarding-small-tour \
                      onboarding-small-library onboarding-small-ready deeplink-prompt \
                      deeplink-track deeplink-cold webdav-tree webdav-playing webdav-error; do
            test -s "shots/$shot.png" || { echo "::error ::missing $shot.png"; exit 1; }
          done

          # Background A: a download is started, the app is sent away, and comes
          # back. The track has to be in the library afterwards with nothing
          # pending and no index entry without a file behind it.
          rm -f "$CONTAINER/Documents/shots/background-report.txt" \
                "$CONTAINER/Documents/shots/background-resumed.txt" \
                "$CONTAINER/Documents/shots/background-resumed-done.txt" \
                "$CONTAINER/Documents/shots/background-killed.txt" \
                "$CONTAINER/Documents/shots/background-killed-done.txt"
          xcrun simctl launch "$UDID" "$BUNDLE" -BCBackgroundStart "$CONTAINER/Documents/shots" keep
          for i in $(seq 1 45); do
            [ -f "$CONTAINER/Documents/shots/background-report.txt" ] && break
            sleep 1
          done
          echo "### Background start"
          cat "$CONTAINER/Documents/shots/background-report.txt" 2>/dev/null || true
          grep -q "background.live=true" "$CONTAINER/Documents/shots/background-report.txt"
          # Launching another app is how the harness sends ours to the background.
          xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null 2>&1 \
            || xcrun simctl launch "$UDID" com.apple.mobilesafari > /dev/null 2>&1 || true
          sleep 8
          xcrun simctl launch "$UDID" "$BUNDLE" > /dev/null 2>&1 || true
          for i in $(seq 1 60); do
            [ -f "$CONTAINER/Documents/shots/background-resumed-done.txt" ] && break
            sleep 2
          done
          echo "### Background resumed"
          cat "$CONTAINER/Documents/shots/background-resumed.txt" 2>/dev/null || true
          cp -R "$CONTAINER/Documents/shots/." shots/ || true
          [ -f shots/background-resumed.txt ] || { echo "::error ::no background resumed report"; exit 1; }
          grep -q "background.indexed=true" shots/background-resumed.txt
          grep -q "background.pendingAfter=0" shots/background-resumed.txt
          grep -q "background.phantom=false" shots/background-resumed.txt

          # Background B: the same download force-quit mid-transfer. The next
          # launch must adopt it or say it was interrupted, with the index left
          # consistent either way.
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" -BCBackgroundStart "$CONTAINER/Documents/shots"
          for i in $(seq 1 45); do
            [ -f "$CONTAINER/Documents/shots/background-report.txt" ] && break
            sleep 1
          done
          sleep 1
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 2
          xcrun simctl launch "$UDID" "$BUNDLE" -BCBackgroundVerify "$CONTAINER/Documents/shots" killed
          for i in $(seq 1 120); do
            [ -f "$CONTAINER/Documents/shots/background-killed-done.txt" ] && break
            sleep 2
          done
          echo "### Background killed"
          cat "$CONTAINER/Documents/shots/background-killed.txt" 2>/dev/null || true
          cp -R "$CONTAINER/Documents/shots/." shots/ || true
          [ -f shots/background-killed.txt ] || { echo "::error ::no background killed report"; exit 1; }
          grep -q "background.settled=true" shots/background-killed.txt
          grep -Eq "background.indexed=true|background.reported=true" shots/background-killed.txt
          grep -q "background.pendingAfter=0" shots/background-killed.txt
          grep -q "background.phantom=false" shots/background-killed.txt
          # The locker and the queue history, read back by that fresh process.
          grep -q "verify.localTracks=1" shots/background-killed.txt
          VERIFY_HISTORY=$(sed -n 's/^verify.history=//p' shots/background-killed.txt | head -1)
          echo "history read back: $VERIFY_HISTORY"
          test -n "$VERIFY_HISTORY"
          test "$VERIFY_HISTORY" -ge 2
          test -n "$(sed -n 's/^verify.localTitle=//p' shots/background-killed.txt | head -1)"
          test -n "$(sed -n 's/^verify.historyTop=//p' shots/background-killed.txt | head -1)"
          grep -q "verify.onboardingCompleted=true" shots/background-killed.txt

          # The playlist is read back from disk in that relaunched process, and
          # has to match what the sync wrote in the process before it.
          VERIFY_FIRST=$(sed -n 's/^verify.playlistFirst=//p' shots/background-killed.txt | head -1)
          SYNC_FIRST=$(sed -n 's/^sync.first=//p' "$REPORT" | head -1)
          echo "playlist first: synced [$SYNC_FIRST] read-back [$VERIFY_FIRST]"
          test -n "$SYNC_FIRST"
          test "$SYNC_FIRST" = "$VERIFY_FIRST"
          kill "$ADDON_PID" 2>/dev/null || true
          kill "$WEBDAV_PID" 2>/dev/null || true

      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BitChordIOS12V2-screenshots
          path: |
            v2/shots
            v2/shots-build.log
          retention-days: 14

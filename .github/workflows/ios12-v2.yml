name: Build iOS 12 IPA (v2 port)

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/ios12-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project BitChordIOS12V2.xcodeproj -list

      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChordIOS12V2.xcodeproj \
            -scheme BitChordIOS12V2 \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "::error ::build.log was never created - the build failed before xcodebuild ran"
            exit 0
          fi
          grep -aE "error:|xcodebuild: error|BUILD FAILED|The following build commands failed" build.log \
            | head -8 \
            | tr -d '\r' \
            | while IFS= read -r line; do
                echo "::error ::${line:0:800}"
              done
          if ! grep -qaE "error:" build.log; then
            tail -8 build.log \
              | tr -d '\r' \
              | while IFS= read -r line; do
                  echo "::notice ::${line:0:800}"
                done
          fi

      - name: Report build diagnostics
        if: always()
        run: |
          {
            echo "### Schemes in generated project"
            echo '```'
            xcodebuild -project BitChordIOS12V2.xcodeproj -list 2>&1 || true
            echo '```'
            echo "### Compiler errors"
            echo '```'
            grep -nE "error:|xcodebuild: error|BUILD FAILED" build.log 2>/dev/null | head -60 || true
            echo '```'
            echo "### Last 40 log lines"
            echo '```'
            tail -40 build.log 2>/dev/null || echo "(no build.log written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment target
        if: success()
        run: |
          set -o pipefail
          APP="build/Build/Products/Release-iphoneos/BitChordIOS12V2.app"
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "MinimumOSVersion: $MIN"
          echo "::notice ::Built app MinimumOSVersion = $MIN"
          MINOS=$(otool -l "$APP/BitChordIOS12V2" | grep -m1 minos | tr -s ' ' | sed 's/^ *//')
          echo "binary $MINOS"
          echo "::notice ::Binary LC_BUILD_VERSION $MINOS"
          ARCHS=$(lipo -archs "$APP/BitChordIOS12V2")
          echo "::notice ::Architectures: $ARCHS"

      - name: Package unsigned IPA
        if: success()
        run: |
          set -o pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BitChordIOS12V2.app" Payload/
          /usr/bin/zip -qry BitChordIOS12V2-unsigned.ipa Payload
          ls -lh BitChordIOS12V2-unsigned.ipa

      - name: Verify the IPA itself
        if: success()
        run: |
          set -o pipefail
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -q BitChordIOS12V2-unsigned.ipa -d /tmp/ipacheck
          APP=$(find /tmp/ipacheck/Payload -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "ipa MinimumOSVersion=$MIN"
          echo "::notice ::IPA MinimumOSVersion = $MIN"
          test "$MIN" = "12.0"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ARCHS=$(lipo -archs "$BIN")
          echo "ipa architectures=$ARCHS"
          echo "::notice ::IPA architectures = $ARCHS"
          echo "$ARCHS" | grep -q "arm64"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChordIOS12V2-unsigned-ipa
          path: v2/BitChordIOS12V2-unsigned.ipa
          retention-days: 30

  simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChordIOS12V2.xcodeproj \
            -scheme BitChordIOS12V2 \
            -sdk iphonesimulator \
            -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build-sim \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee sim.log

      - name: Report simulator build errors
        if: failure()
        run: |
          if [ -f sim.log ]; then
            grep -aE "error:|xcodebuild: error|BUILD FAILED" sim.log \
              | head -8 \
              | tr -d '\r' \
              | while IFS= read -r line; do
                  echo "::error ::${line:0:800}"
                done
          fi

      - name: Package simulator bundle for Appetize
        if: success()
        run: |
          set -o pipefail
          APP="build-sim/Build/Products/Release-iphonesimulator/BitChordIOS12V2.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" BitChordIOS12V2-simulator.zip
          ls -lh BitChordIOS12V2-simulator.zip
          echo "::notice ::Simulator bundle packaged for Appetize upload"

      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChordIOS12V2-simulator
          path: v2/BitChordIOS12V2-simulator.zip
          retention-days: 30
  screenshots:
    runs-on: macos-15
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChordIOS12V2.xcodeproj \
            -scheme BitChordIOS12V2 \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build-shots \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee shots-build.log

      - name: Capture screens
        run: |
          set -o pipefail
          APP="build-shots/Build/Products/Release-iphonesimulator/BitChordIOS12V2.app"
          test -d "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1 || true)
          echo "runtime=$RUNTIME"
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]' | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}' | head -1 || true)
          if [ -z "$UDID" ]; then
            for T in iPhone-17-Pro iPhone-16 iPhone-15; do
              UDID=$(xcrun simctl create BC-Screens "com.apple.CoreSimulator.SimDeviceType.$T" "$RUNTIME" 2>/dev/null || true)
              if [ -n "$UDID" ]; then break; fi
            done
          fi
          echo "udid=$UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          mkdir -p "$CONTAINER/Documents/shots"
          # First launch downloads one track and quits; the second launch below
          # reads that index back off disk, so the capture proves persistence
          # across a relaunch rather than same-process memory.
          xcrun simctl launch "$UDID" "$BUNDLE" -BCSeedDownload "$CONTAINER/Documents/shots"
          for i in $(seq 1 60); do
            [ -f "$CONTAINER/Documents/shots/download-report.txt" ] && break
            sleep 2
          done
          echo "### Seed report"
          cat "$CONTAINER/Documents/shots/download-report.txt" 2>/dev/null || echo "(seed wrote nothing)"
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 2
          xcrun simctl launch "$UDID" "$BUNDLE" -BCScreenshots "$CONTAINER/Documents/shots"
          # The harness walks the tabs, plays a track, then runs the whole
          # download sequence (resume check, offline playback, delete, quality
          # probe, mid-transfer shot, menus, Wi-Fi hold). It writes done.txt
          # when finished, so wait for the work rather than guessing.
          for i in $(seq 1 120); do
            [ -f "$CONTAINER/Documents/shots/done.txt" ] && break
            sleep 2
          done
          if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE"; then
            echo "app is not running; collecting why"
          fi
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'processImagePath CONTAINS "BitChordIOS12V2"' 2>/dev/null \
            | grep -aiE "fatal|exception|assert|crash|error" | tail -30 || true
          find ~/Library/Logs/DiagnosticReports -name '*BitChord*' -mmin -10 \
            -exec sh -c 'echo "== $1"; head -60 "$1"' _ {} \; 2>/dev/null || true
          rm -rf shots && mkdir -p shots
          cp -R "$CONTAINER/Documents/shots/." shots/ || true
          ls -l shots
          ls shots/*.png > /dev/null
          REPORT=shots/download-report.txt
          echo "### Download report"
          cat "$REPORT" || { echo "::error ::no download report written"; exit 1; }

          # Relaunch, offline playback, deletion.
          grep -q "resume.saved=1" "$REPORT"
          grep -q "localPlayback=true" "$REPORT"
          grep -q "fileRemoved=true" "$REPORT"
          grep -q "deletedRows=0" "$REPORT"

          # Two settings, two renditions: the labels are the app's, the bitrates
          # are measured by afinfo from the files the app stored.
          grep -q "quality.high.label=JioSaavn 320kbps" "$REPORT"
          grep -q "quality.saver.label=JioSaavn 96kbps" "$REPORT"
          grep -q "quality.saverSmaller=true" "$REPORT"
          rate() {
            afinfo "$1" 2>/dev/null | awk '/bit rate/ {for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) {print $i; exit}}'
          }
          test -s shots/quality-high.m4a
          test -s shots/quality-saver.m4a
          HIGH_RATE=$(rate shots/quality-high.m4a)
          SAVER_RATE=$(rate shots/quality-saver.m4a)
          HIGH_SIZE=$(stat -f%z shots/quality-high.m4a)
          SAVER_SIZE=$(stat -f%z shots/quality-saver.m4a)
          echo "high: ${HIGH_RATE}bps ${HIGH_SIZE}B | saver: ${SAVER_RATE}bps ${SAVER_SIZE}B"
          test -n "$HIGH_RATE"
          test -n "$SAVER_RATE"
          test "$HIGH_RATE" -ge 280000
          test "$SAVER_RATE" -le 128000
          test "$SAVER_SIZE" -lt "$HIGH_SIZE"

          # A real mid-transfer frame, the Wi-Fi hold, and all three menus.
          PROGRESS=$(sed -n 's/^progress.captured=//p' "$REPORT" | head -1)
          echo "progress captured at ${PROGRESS}%"
          test -n "$PROGRESS"
          test "$PROGRESS" -gt 0
          test "$PROGRESS" -lt 100
          grep -q "wifi.blocked=true" "$REPORT"
          grep -q "wifi.failedRows=1" "$REPORT"
          grep -q "sheet.delete.downloaded=true" "$REPORT"
          grep -q "sheet.cancel.downloading=true" "$REPORT"
          grep -q "sheet.download.idle=true" "$REPORT"
          for shot in downloads download-progress downloads-saver settings-downloads \
                      sheet-delete sheet-cancel sheet-download wifi-blocked offline downloads-empty; do
            test -s "shots/$shot.png" || { echo "::error ::missing $shot.png"; exit 1; }
          done

      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BitChordIOS12V2-screenshots
          path: |
            v2/shots
            v2/shots-build.log
          retention-days: 14
